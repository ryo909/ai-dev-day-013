<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day013 — Meal Prep Slotter</title>
  <meta name="description" content="平日の食事準備を短時間で回すための作り置き計画ツール。（話題:HN Frontpage）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-badge">Day013</div>
      <h1 class="header-title">Meal Prep Slotter</h1>
      <p class="header-desc">平日の食事準備を短時間で回すための作り置き計画ツール。（話題:HN Frontpage）</p>
    </header>
    <main class="app-main">
      <section class="tool-area">
        <div class="input-group">
          <label for="toolInput" class="input-label">食材リスト</label>
          <textarea id="toolInput" class="input-textarea" rows="6" placeholder="鶏むね肉 ブロッコリー 卵"></textarea>
        </div>
        <button id="actionBtn" class="btn-primary">計画化する</button>
        <div class="output-group" id="outputGroup" style="display:none">
          <label class="input-label">作り置き段取り</label>
          <div id="toolOutput" class="output-area"></div>
        </div>
      </section>
    </main>
    <footer class="app-footer">
      <span>Day013 — 平日の料理負担を先に潰す</span>
      <a href="https://github.com/ryo909/ai-dev-day-013" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
